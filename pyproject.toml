[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dpdp-law-to-code"
version = "0.1.0"
description = "India's Digital Personal Data Protection Act 2023 as runnable Python. MIT. Free. Local-first."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "Rushikesh R. Mahajan (wolfgang_rush)"}
]
keywords = ["dpdp", "india", "privacy", "compliance", "law-to-code", "data-protection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Legal",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.5",
    "ruff>=0.1",
]

[project.scripts]
dpdp-check = "dpdp.cli:main"

[project.urls]
Homepage = "https://github.com/Wolfgangrush/dpdp-law-to-code"
Issues = "https://github.com/Wolfgangrush/dpdp-law-to-code/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["dpdp*"]
exclude = ["tests*", "examples*", "cli*", "docs*"]

[tool.mypy]
strict = true
python_version = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
